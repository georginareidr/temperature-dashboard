<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temperature Dashboard</title>
<style>
body{font-family:Arial;background:#ecfeff;padding:25px}
main{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px}
input,select{width:100%;padding:12px;margin:10px 0;box-sizing:border-box}
button{padding:12px 20px;background:#0891b2;color:white;border:0;border-radius:7px;cursor:pointer}
#result{background:#cffafe;padding:18px;margin-top:18px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Temperature Dashboard</h1>
<input id="value" type="number" step="any" placeholder="Enter temperature">
<select id="unit">
<option value="C">Celsius</option>
<option value="F">Fahrenheit</option>
<option value="K">Kelvin</option>
</select>
<button onclick="convert()">Convert Temperature</button>
<div id="result">Results will appear here.</div>
</main>
<script>
function convert(){
 const raw=document.getElementById("value").value;
 const unit=document.getElementById("unit").value;
 const out=document.getElementById("result");
 if(raw.trim()===""){out.textContent="Enter a temperature.";return;}
 const n=Number(raw);
 let c;
 if(unit==="C")c=n;
 else if(unit==="F")c=(n-32)*5/9;
 else c=n-273.15;
 if(c< -273.15){
  out.textContent="Temperature cannot be below absolute zero.";
  return;
 }
 const f=c*9/5+32;
 const k=c+273.15;
 out.textContent=`Celsius: ${c.toFixed(2)} °C | Fahrenheit: ${f.toFixed(2)} °F | Kelvin: ${k.toFixed(2)} K`;
}
</script>
</body>
</html>
